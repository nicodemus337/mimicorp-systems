name: Update Alaska election results

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: alaska-results-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download official Alaska snapshot
        run: curl --fail --silent --show-error --location https://www.elections.alaska.gov/enr/26PRIM/results/precincts.js --output alaska-precincts.json
      - name: Fetch and normalize official Alaska results
        run: ALASKA_SOURCE_FILE=alaska-precincts.json node scripts/update-alaska-results.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- elections/data/alaska.json; then
            echo "No result changes."
            exit 0
          fi
          git config user.name "mimicorp results bot"
          git config user.email "results-bot@mimicorp.systems"
          git add elections/data/alaska.json
          git commit -m "update Alaska election results"
          git push

